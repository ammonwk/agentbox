<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="agentbox" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>agentbox</title>
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%230d0d0d'/%3E%3Crect x='8' y='8' width='16' height='4' rx='1.5' fill='%23f97316'/%3E%3Crect x='8' y='16' width='10' height='4' rx='1.5' fill='%23fafafa'/%3E%3Crect x='8' y='22' width='13' height='3' rx='1.5' fill='%23636363'/%3E%3C/svg%3E"
    />
    <script>
      // Paint in the right theme before React mounts. The real preference is a
      // server setting; this is only the cache App.tsx writes on every change,
      // so a reload does not flash white before the socket answers.
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("agentbox.theme");
        } catch (err) {
          // Private-mode Safari throws on localStorage; the system default is fine.
        }
        var dark =
          pref === "dark" ||
          ((pref === null || pref === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
      // The accent chosen in Settings, from the values lib/accent.ts stores.
      // With none stored, the stylesheet's orange stays.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("agentbox.accent") || "null");
          if (!s || typeof s.pick !== "string") return;
          var root = document.documentElement;
          root.dataset.accent = s.pick;
          root.style.setProperty("--pick-dark", s.dark);
          root.style.setProperty("--pick-light", s.light);
          root.style.setProperty("--pick-dark-on", s.darkOn);
          root.style.setProperty("--pick-light-on", s.lightOn);
        } catch (err) {
          // Private mode or a bad value: the orange is fine.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
